services:
  server:
    build: ./server
    ports:
      - "8078:8078"
    volumes:
      - board_data:/data
    environment:
      - BOARD_DB=/data/board.db
      - BOARD_HOST=0.0.0.0

  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./web:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5174:5174"
    environment:
      - VITE_API_URL=http://server:8078
    depends_on:
      - server

volumes:
  board_data:
