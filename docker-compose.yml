# Sobe o quadro para uso local: http://localhost:5174
# As duas portas são publicadas só em 127.0.0.1. Para acessar de outra máquina,
# defina BOARD_API_KEY e sirva a interface por um proxy (web/vite.proxy.example.mjs).
services:
  server:
    build: ./server
    ports:
      - "127.0.0.1:8078:8078"
    volumes:
      - board_data:/data
    environment:
      # Sem chave: aceitável aqui porque a porta só é publicada em localhost.
      - BOARD_PERMITIR_ABERTO=1
      - BOARD_API_KEY=${BOARD_API_KEY:-}
    restart: unless-stopped

  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./web:/app
      - web_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "127.0.0.1:5174:5174"
    environment:
      - VITE_API_URL=http://server:8078
    depends_on:
      - server

volumes:
  board_data:
  web_modules:
