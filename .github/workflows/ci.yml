name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Server - install
        run: npm ci
        working-directory: ./server
      - name: Server - typecheck
        run: npm run typecheck
        working-directory: ./server
      - name: Server - unit tests
        run: npm test
        working-directory: ./server
      - name: Server - build
        run: npm run build
        working-directory: ./server
      - name: Server - integration (REST + MCP against a throwaway database)
        run: node verificar-integracao.mjs
        working-directory: ./server

      - name: Web - install
        run: npm ci
        working-directory: ./web
      - name: Web - lint
        run: npm run lint
        working-directory: ./web
      - name: Web - build
        run: npm run build
        working-directory: ./web

      - name: CLI - syntax
        run: node --check cli/agent-board.mjs
